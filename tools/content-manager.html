<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Manager | Scrutiny Academy</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f8fb;color:#14213d}.wrap{max-width:1150px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #dce3ee;border-radius:16px;padding:20px}label{display:block;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #b8c4d6;border-radius:9px}textarea{min-height:90px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#173b72;color:#fff;margin:12px 8px 0 0}.secondary{background:#eaf0f8;color:#173b72}pre{white-space:pre-wrap;word-break:break-word;background:#0e1726;color:#e8eef8;padding:14px;border-radius:12px;min-height:300px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Scrutiny Academy Content Manager</h1><p>Build clean question JSON locally. This tool does not publish or upload anything by itself.</p><div class="grid"><section class="card"><label>ID</label><input id="id" placeholder="C11-BOT-CELL-001"><label>Type</label><select id="type"><option>MCQ</option><option>VSAQ</option><option>SAQ</option><option>LAQ</option><option>PYQ</option></select><label>Question</label><textarea id="question"></textarea><label>Options (one per line for MCQ)</label><textarea id="options"></textarea><label>Correct option index (0-3)</label><input id="answer" type="number" min="0" max="3"><label>Explanation</label><textarea id="explanation"></textarea><label>Difficulty</label><select id="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select><label>Source</label><input id="source" value="Scrutiny Academy Practice Question"><label>Year (PYQ only)</label><input id="year" type="number"><label>Exam (PYQ only)</label><input id="exam"><button id="add">Add question</button><button class="secondary" id="reset">Reset list</button></section><section class="card"><h2>JSON Preview</h2><pre id="preview">[]</pre><button id="copy">Copy JSON</button><button class="secondary" id="download">Download .json</button></section></div></main><script>let questions=[];const $=id=>document.getElementById(id),preview=()=>{$('preview').textContent=JSON.stringify({questions},null,2)};$('add').onclick=()=>{const type=$('type').value,q={id:$('id').value.trim(),type,question:$('question').value.trim(),source:$('source').value.trim()};if(type==='MCQ'){q.options=$('options').value.split('\n').map(x=>x.trim()).filter(Boolean);q.answer=Number($('answer').value);q.explanation=$('explanation').value.trim();q.difficulty=$('difficulty').value}if(type==='PYQ'){q.year=Number($('year').value)||null;q.exam=$('exam').value.trim()}questions.push(q);preview()};$('reset').onclick=()=>{questions=[];preview()};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('preview').textContent);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy JSON',1200)};$('download').onclick=()=>{const blob=new Blob([$('preview').textContent],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='scrutiny-questions.json';a.click();URL.revokeObjectURL(a.href)};</script></body></html>
