<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Validator | Scrutiny Academy</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f8fb;color:#14213d}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dce3ee;border-radius:16px;padding:20px;box-shadow:0 8px 24px #14213d0d}textarea{width:100%;min-height:360px;box-sizing:border-box;padding:14px;border:1px solid #b8c4d6;border-radius:10px;font:13px ui-monospace,monospace}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#173b72;color:#fff;margin:10px 8px 10px 0}.secondary{background:#eaf0f8;color:#173b72}.ok{color:#08783d}.bad{color:#b42318}.row{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f6f8fb;border-radius:10px;padding:10px 14px}li{margin:7px 0}.muted{color:#637083}</style></head><body><main class="wrap"><h1>Scrutiny Academy Question Validator</h1><p class="muted">Validate a question array or an object containing a <code>questions</code> array before publishing.</p><section class="card"><textarea id="input" placeholder='Paste JSON here...'></textarea><div><button id="validate">Validate</button><button class="secondary" id="clear">Clear</button></div><div id="summary" class="row"></div><ol id="errors"></ol></section></main><script>const input=document.getElementById('input'),errors=document.getElementById('errors'),summary=document.getElementById('summary');function add(arr,msg){arr.push(msg)}function validate(){errors.innerHTML='';summary.innerHTML='';let data;try{data=JSON.parse(input.value)}catch(e){errors.innerHTML='<li class="bad">Invalid JSON: '+e.message+'</li>';return}const qs=Array.isArray(data)?data:data.questions;if(!Array.isArray(qs)){errors.innerHTML='<li class="bad">Expected an array or an object containing questions[].</li>';return}const issues=[],ids=new Set(),normalized=new Set();qs.forEach((q,i)=>{const p='Question '+(i+1);if(!q||typeof q!=='object'){add(issues,p+': not an object');return}if(!q.id)add(issues,p+': missing id');else if(ids.has(q.id))add(issues,p+': duplicate id '+q.id);else ids.add(q.id);if(!q.type)add(issues,p+': missing type');if(!q.question||!String(q.question).trim())add(issues,p+': empty question');else{const n=String(q.question).trim().toLowerCase().replace(/\s+/g,' ');if(normalized.has(n))add(issues,p+': duplicate question text');normalized.add(n)}if(q.type==='MCQ'){if(!Array.isArray(q.options)||q.options.length!==4)add(issues,p+': MCQ must have exactly 4 options');else if(new Set(q.options.map(x=>String(x).trim().toLowerCase())).size!==4)add(issues,p+': duplicate MCQ options');if(!Number.isInteger(q.answer)||q.answer<0||q.answer>3)add(issues,p+': answer must be an integer 0–3');if(!q.explanation||!String(q.explanation).trim())add(issues,p+': missing explanation');}if(q.type==='PYQ'){if(!q.year)add(issues,p+': PYQ missing year');if(!q.exam)add(issues,p+': PYQ missing exam');}if(!q.source)add(issues,p+': missing source');});summary.innerHTML='<div class="stat"><b>'+qs.length+'</b> questions</div><div class="stat"><b>'+ids.size+'</b> unique IDs</div><div class="stat"><b>'+issues.length+'</b> issues</div>';if(!issues.length)errors.innerHTML='<li class="ok"><b>Passed.</b> No structural issues detected.</li>';else errors.innerHTML=issues.map(x=>'<li class="bad">'+escapeHtml(x)+'</li>').join('')}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('validate').onclick=validate;document.getElementById('clear').onclick=()=>{input.value='';errors.innerHTML='';summary.innerHTML=''};</script></body></html>
