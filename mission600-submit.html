<!doctype html><html lang="en" class="auth-check"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission 600 Written Submission</title><link rel="stylesheet" href="mission600.css?v=1"><style>.auth-check body{visibility:hidden}.submission-shell{max-width:1000px;margin:auto;padding:28px 14px 70px}.submission-head,.answer-panel{padding:22px;border:1px solid var(--line);border-radius:19px;background:#fff}.submission-head h1{color:var(--navy)}.question-paper{display:grid;gap:12px;margin:16px 0}.question{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.question b{color:var(--blue)}.answer-panel{display:grid;gap:14px}.answer-panel label{display:grid;gap:7px;color:var(--navy);font-weight:900}.answer-panel textarea{min-height:260px;border:1px solid var(--line);border-radius:11px;padding:13px;font:inherit;line-height:1.55}.upload-zone{padding:18px;border:2px dashed #abc1d3;border-radius:14px;background:#f8fbfd}.submission-actions{display:flex;gap:9px;flex-wrap:wrap}.submission-actions button{border:0;border-radius:10px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:950}.submission-actions .final{background:var(--green)}.submission-actions button:disabled{background:#cfd8e0}.file-list{color:var(--muted);font-size:.78rem}</style></head><body><header class="topbar"><a class="brand" href="mission600.html"><img src="assets/logo.svg" alt=""><span><strong>SCRUTINY ACADEMY</strong><small>MISSION 600 · WRITTEN ANSWER</small></span></a><div class="top-actions"><a href="mission600.html">Back to Mission 600</a></div></header><main class="submission-shell"><section class="submission-head"><span class="eyebrow" id="testCode">WRITTEN TEST</span><h1 id="testName">Loading question paper…</h1><p id="testMeta"></p><span class="status" id="submissionStatus">DRAFT</span></section><section class="question-paper" id="questionPaper"></section><form class="answer-panel" id="answerForm"><label>Type your answers<textarea id="typedAnswers" placeholder="Write question numbers clearly. You may also upload handwritten pages below."></textarea></label><label class="upload-zone">Upload handwritten answer sheets (JPG, PNG, WEBP or PDF; max 20 MB each)<input id="answerFiles" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple></label><div class="file-list" id="fileList">No files uploaded.</div><div class="submission-actions"><button type="button" id="saveDraft">SAVE DRAFT</button><button type="submit" class="final" id="submitFinal">SUBMIT FINAL ANSWERS</button></div><p class="admin-status" id="formMessage">Final descriptive marks are published only after Founder/teacher review.</p></form></main><script type="module" src="mission600-submit.js?v=1"></script></body></html>
