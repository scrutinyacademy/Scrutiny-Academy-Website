name: Deploy Mission 600 Mathematics DPPs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission600-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install backend dependencies
        working-directory: functions
        run: npm ci

      - name: Generate and validate the protected DPP banks
        run: |
          node scripts/build-mission600-math-dpps.mjs
          node scripts/test-mission600-math-dpps.mjs

      - name: Prepare revocable Firebase credentials
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-adc.json
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,JSON.stringify({type:"authorized_user",client_id:"563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com",client_secret:"j9iVZfS8kkCEFUPaAeJV0sAi",refresh_token:process.env.FIREBASE_TOKEN}),{mode:0o600})'
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS" >> "$GITHUB_ENV"

      - name: Deploy Mission 600 rules and payment functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >-
          npx --yes firebase-tools@15.33.0 deploy
          --project scrutiny-academy
          --token "$FIREBASE_TOKEN"
          --non-interactive
          --only firestore:rules,functions:createMission600Order,functions:verifyMission600Payment,functions:mission600RazorpayWebhook

      - name: Publish the approved Mathematics DPPs
        run: >-
          node functions/scripts/seed-mission600-math-dpps.js
          --confirm-production-change
          --academically-reviewed
          --enable-purchases
