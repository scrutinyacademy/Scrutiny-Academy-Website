name: Deploy NEET-SS Surgery Backend

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "functions/index.js"
      - ".github/workflows/deploy-neetss.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neetss-surgery-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase backend dependencies
        working-directory: functions
        run: npm ci
      - name: Validate Phase 1 and backend syntax
        run: |
          node --check functions/index.js
          node scripts/validate-neetss-phase1.mjs
          node scripts/validate-multi-course-switcher.mjs
          node tests/student-progress-isolation.cjs
      - name: Deploy NEET-SS security rules and founder access function
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >-
          npx --yes firebase-tools@15.33.0 deploy
          --project scrutiny-academy
          --token "$FIREBASE_TOKEN"
          --non-interactive
          --only firestore:rules,functions:setNeetssComplimentaryAccess
