name: Deploy NEET-SS Surgery Backend

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "functions/index.js"
      - "functions/neetss-*.cjs"
      - "functions/arabic-content.cjs"
      - ".github/workflows/deploy-neetss.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neetss-surgery-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase backend dependencies
        working-directory: functions
        run: npm ci
      - name: Validate Phase 1 and backend syntax
        run: |
          node --check functions/index.js
          node scripts/validate-neetss-phase1.mjs
          node scripts/validate-neetss-phase2.mjs
          node tests/neetss-preparation-core.mjs
          node scripts/validate-neetss-preparation.mjs
          node scripts/validate-neetss-pricing.mjs
          node scripts/validate-multi-course-switcher.mjs
          node tests/student-progress-isolation.cjs
      - name: Prepare revocable Firebase credentials
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-adc.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const service = process.env.FIREBASE_SERVICE_ACCOUNT;
          const token = process.env.FIREBASE_TOKEN;
          if (service) {
            fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, JSON.stringify(JSON.parse(service)), {mode: 0o600});
            fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${process.env.GOOGLE_APPLICATION_CREDENTIALS}\n`);
          } else if (token) {
            fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_TOKEN=${token}\n`);
          } else {
            throw new Error('Add FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN in GitHub Actions secrets.');
          }
          NODE
      - name: Deploy NEET-SS rules and secure payment functions
        run: >-
          npx --yes firebase-tools@15.33.0 deploy
          --project scrutiny-academy
          --non-interactive
          --only functions:getArabicCourseContent,firestore:rules,functions:getNeetssCourseContent,functions:getStudentOfferStatus,functions:createRazorpayOrder,functions:verifyRazorpayPayment,functions:syncRazorpayPayment,functions:razorpayWebhook,functions:setNeetssComplimentaryAccess
