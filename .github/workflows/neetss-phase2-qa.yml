name: NEET-SS Phase 2 QA
on:
  push:
    branches: [main]
    paths: ['neetss-*', 'functions/neetss-*', 'tests/neetss-*']
  pull_request:
    paths:
      - 'neetss-*'
      - 'functions/neetss-*'
      - 'functions/index.js'
      - 'scripts/validate-neetss-*'
      - 'tests/neetss-phase2-browser.cjs'
      - '.github/workflows/neetss-phase2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content, security structure and regression checks
        run: |
          node --check functions/index.js
          node --check neetss-phase2-ui.js
          node scripts/validate-neetss-phase1.mjs
          node scripts/validate-neetss-phase2.mjs
          node tests/neetss-preparation-core.mjs
          node scripts/validate-neetss-preparation.mjs
          node scripts/validate-neetss-pricing.mjs
          node scripts/validate-multi-course-switcher.mjs
          node tests/student-progress-isolation.cjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/neetss-browser" --no-save playwright@1.58.2
          node "$RUNNER_TEMP/neetss-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser flows and mobile/iPad/desktop layout
        env:
          NODE_PATH: ${{ runner.temp }}/neetss-browser/node_modules
        run: node tests/neetss-phase2-browser.cjs
