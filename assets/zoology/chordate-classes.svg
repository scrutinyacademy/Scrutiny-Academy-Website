<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Chordate classification</title><desc id="d">Notochord to major vertebrate classes</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#138a73"/></marker><style>.title{font:800 30px Arial;fill:#102a4c}.sub{font:500 16px Arial;fill:#536b86}.label{font:700 18px Arial;fill:#17365d}.note{font:500 13px Arial;fill:#506781}.arrow{font:700 13px Arial;fill:#08765d}</style></defs><rect width="1000" height="620" fill="#fbfdff"/><text x="500" y="48" text-anchor="middle" class="title">Chordate classification</text><text x="500" y="76" text-anchor="middle" class="sub">SCRUTINY ACADEMY • BOARD DIAGRAM</text><g><path d="M500 180 L170 270" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M500 180 L400 270" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M500 180 L630 270" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M730 307 L760 307" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M845 345 L195 460" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M845 345 L400 460" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M845 345 L605 460" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M845 345 L810 460" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><rect x="385" y="105" width="230" height="75" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="500" y="135" text-anchor="middle" class="label">Chordata</text><text x="500" y="158" text-anchor="middle" class="note">notochord • dorsal nerve cord</text></g><g><rect x="70" y="270" width="200" height="75" rx="18" fill="#eaf2ff" stroke="#17365d" stroke-width="2"/><text x="170" y="300" text-anchor="middle" class="label">Urochordata</text><text x="170" y="323" text-anchor="middle" class="note">larval notochord</text></g><g><rect x="300" y="270" width="200" height="75" rx="18" fill="#fff4df" stroke="#17365d" stroke-width="2"/><text x="400" y="300" text-anchor="middle" class="label">Cephalochordata</text><text x="400" y="323" text-anchor="middle" class="note">persistent notochord</text></g><g><rect x="530" y="270" width="200" height="75" rx="18" fill="#f3ecff" stroke="#17365d" stroke-width="2"/><text x="630" y="300" text-anchor="middle" class="label">Vertebrata</text><text x="630" y="323" text-anchor="middle" class="note">cranium • vertebral column</text></g><g><rect x="760" y="270" width="170" height="75" rx="18" fill="#ffecef" stroke="#17365d" stroke-width="2"/><text x="845" y="300" text-anchor="middle" class="label">Gnathostomata</text><text x="845" y="323" text-anchor="middle" class="note">jawed vertebrates</text></g><g><rect x="110" y="460" width="170" height="70" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="195" y="490" text-anchor="middle" class="label">Fishes</text><text x="195" y="513" text-anchor="middle" class="note">gills • fins</text></g><g><rect x="315" y="460" width="170" height="70" rx="18" fill="#eaf2ff" stroke="#17365d" stroke-width="2"/><text x="400" y="490" text-anchor="middle" class="label">Amphibia</text><text x="400" y="513" text-anchor="middle" class="note">moist skin</text></g><g><rect x="520" y="460" width="170" height="70" rx="18" fill="#fff4df" stroke="#17365d" stroke-width="2"/><text x="605" y="490" text-anchor="middle" class="label">Reptilia</text><text x="605" y="513" text-anchor="middle" class="note">amniotic egg</text></g><g><rect x="725" y="460" width="170" height="70" rx="18" fill="#f3ecff" stroke="#17365d" stroke-width="2"/><text x="810" y="490" text-anchor="middle" class="label">Aves / Mammalia</text><text x="810" y="513" text-anchor="middle" class="n