<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Life cycle of Plasmodium</title><desc id="d">Human asexual phase and mosquito sexual phase</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#138a73"/></marker><style>.title{font:800 30px Arial;fill:#102a4c}.sub{font:500 16px Arial;fill:#536b86}.label{font:700 18px Arial;fill:#17365d}.note{font:500 13px Arial;fill:#506781}.arrow{font:700 13px Arial;fill:#08765d}</style></defs><rect width="1000" height="620" fill="#fbfdff"/><text x="500" y="48" text-anchor="middle" class="title">Life cycle of Plasmodium</text><text x="500" y="76" text-anchor="middle" class="sub">SCRUTINY ACADEMY • BOARD DIAGRAM</text><g><path d="M260 192 L300 192" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M500 192 L540 192" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M740 192 L780 192" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M865 235 L760 390" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M650 432 L490 432" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M270 432 L160 235" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="215" y="326.5" text-anchor="middle" class="arrow">next bite</text></g><g><rect x="60" y="150" width="200" height="85" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="160" y="180" text-anchor="middle" class="label">Mosquito bite</text><text x="160" y="203" text-anchor="middle" class="note">sporozoites enter blood</text></g><g><rect x="300" y="150" width="200" height="85" rx="18" fill="#eaf2ff" stroke="#17365d" stroke-width="2"/><text x="400" y="180" text-anchor="middle" class="label">Liver phase</text><text x="400" y="203" text-anchor="middle" class="note">schizogony • merozoites</text></g><g><rect x="540" y="150" width="200" height="85" rx="18" fill="#fff4df" stroke="#17365d" stroke-width="2"/><text x="640" y="180" text-anchor="middle" class="label">Red-cell phase</text><text x="640" y="203" text-anchor="middle" class="note">fever cycles</text></g><g><rect x="780" y="150" width="170" height="85" rx="18" fill="#f3ecff" stroke="#17365d" stroke-width="2"/><text x="865" y="180" text-anchor="middle" class="label">Gametocytes</text><text x="865" y="203" text-anchor="middle" class="note">taken by mosquito</text></g><g><rect x="650" y="390" width="220" height="85" rx="18" fill="#ffecef" stroke="#17365d" stroke-width="2"/><text x="760" y="420" text-anchor="middle" class="label">Mosquito gut</text><text x="760" y="443" text-anchor="middle" class="note">fertilisation • oocyst</text></g><g><rect x="270" y="390" width="220" height="85" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="380" y="420" text-anchor="middle" class="label">Salivary glands</text><text x="380" y="443" text-anchor="middle" class="note">sporozoites accumulate</text></g><text x="500" y="598" text-anchor="middle" class="sub">Redraw neatly and label every indicated structure in the examination.</text></svg>
