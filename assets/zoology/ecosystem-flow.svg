<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Energy flow and nutrient cycling</title><desc id="d">Core ecosystem relationships</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#138a73"/></marker><style>.title{font:800 30px Arial;fill:#102a4c}.sub{font:500 16px Arial;fill:#536b86}.label{font:700 18px Arial;fill:#17365d}.note{font:500 13px Arial;fill:#506781}.arrow{font:700 13px Arial;fill:#08765d}</style></defs><rect width="1000" height="620" fill="#fbfdff"/><text x="500" y="48" text-anchor="middle" class="title">Energy flow and nutrient cycling</text><text x="500" y="76" text-anchor="middle" class="sub">SCRUTINY ACADEMY • BOARD DIAGRAM</text><g><path d="M500 165 L180 250" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="340" y="200.5" text-anchor="middle" class="arrow">light</text></g><g><path d="M280 287 L400 287" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="340" y="280" text-anchor="middle" class="arrow">feeding</text></g><g><path d="M600 287 L720 287" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="660" y="280" text-anchor="middle" class="arrow">detritus</text></g><g><path d="M820 325 L615 450" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="717.5" y="380.5" text-anchor="middle" class="arrow">minerals</text></g><g><path d="M385 487 L180 325" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="282.5" y="399" text-anchor="middle" class="arrow">uptake</text></g><g><rect x="385" y="90" width="230" height="75" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="500" y="120" text-anchor="middle" class="label">Solar energy</text><text x="500" y="143" text-anchor="middle" class="note">primary energy source</text></g><g><rect x="80" y="250" width="200" height="75" rx="18" fill="#eaf2ff" stroke="#17365d" stroke-width="2"/><text x="180" y="280" text-anchor="middle" class="label">Producers</text><text x="180" y="303" text-anchor="middle" class="note">capture light energy</text></g><g><rect x="400" y="250" width="200" height="75" rx="18" fill="#fff4df" stroke="#17365d" stroke-width="2"/><text x="500" y="280" text-anchor="middle" class="label">Consumers</text><text x="500" y="303" text-anchor="middle" class="note">transfer energy</text></g><g><rect x="720" y="250" width="200" height="75" rx="18" fill="#f3ecff" stroke="#17365d" stroke-width="2"/><text x="820" y="280" text-anchor="middle" class="label">Decomposers</text><text x="820" y="303" text-anchor="middle" class="note">mineralise detritus</text></g><g><rect x="385" y="450" width="230" height="75" rx="18" fill="#ffecef" stroke="#17365d" stroke-width="2"/><text x="500" y="480" text-anchor="middle" class="label">Abiotic nutrient pool</text><text x="500" y="503" text-anchor="middle" class="note">soil • water • atmosphere</text></g><text x="500" y="598" text-anchor="middle" class="sub">Redraw neatly and label every indicated structure in the examination.</text></svg>
