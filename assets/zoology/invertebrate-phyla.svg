<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Major invertebrate phyla</title><desc id="d">Diagnostic characters used in board classification</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#138a73"/></marker><style>.title{font:800 30px Arial;fill:#102a4c}.sub{font:500 16px Arial;fill:#536b86}.label{font:700 18px Arial;fill:#17365d}.note{font:500 13px Arial;fill:#506781}.arrow{font:700 13px Arial;fill:#08765d}</style></defs><rect width="1000" height="620" fill="#fbfdff"/><text x="500" y="48" text-anchor="middle" class="title">Major invertebrate phyla</text><text x="500" y="76" text-anchor="middle" class="sub">SCRUTINY ACADEMY • BOARD DIAGRAM</text><g><path d="M155 200 L220 350" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M390 200 L475 350" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M625 200 L600 350" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M852 200 L780 350" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><rect x="55" y="120" width="200" height="80" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="155" y="150" text-anchor="middle" class="label">Porifera</text><text x="155" y="173" text-anchor="middle" class="note">canals • choanocytes</text></g><g><rect x="290" y="120" width="200" height="80" rx="18" fill="#eaf2ff" stroke="#17365d" stroke-width="2"/><text x="390" y="150" text-anchor="middle" class="label">Cnidaria</text><text x="390" y="173" text-anchor="middle" class="note">cnidocytes • radial</text></g><g><rect x="525" y="120" width="200" height="80" rx="18" fill="#fff4df" stroke="#17365d" stroke-width="2"/><text x="625" y="150" text-anchor="middle" class="label">Platyhelminthes</text><text x="625" y="173" text-anchor="middle" class="note">acoelomate • flat</text></g><g><rect x="760" y="120" width="185" height="80" rx="18" fill="#f3ecff" stroke="#17365d" stroke-width="2"/><text x="852.5" y="150" text-anchor="middle" class="label">Aschelminthes</text><text x="852.5" y="173" text-anchor="middle" class="note">pseudocoelom</text></g><g><rect x="120" y="350" width="200" height="80" rx="18" fill="#ffecef" stroke="#17365d" stroke-width="2"/><text x="220" y="380" text-anchor="middle" class="label">Annelida</text><text x="220" y="403" text-anchor="middle" class="note">segmented • coelom</text></g><g><rect x="400" y="350" width="200" height="80" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="500" y="380" text-anchor="middle" class="label">Arthropoda</text><text x="500" y="403" text-anchor="middle" class="note">jointed appendages</text></g><g><rect x="680" y="350" width="200" height="80" rx="18" fill="#eaf2ff" stroke="#17365d" stroke-width="2"/><text x="780" y="380" text-anchor="middle" class="label">Mollusca</text><text x="780" y="403" text-anchor="middle" class="note">mantle • muscular foot</text></g><text x="500" y="598" text-anchor="middle" class="sub">Redraw neatly and label every indicated structure in the examination.</text></svg>
