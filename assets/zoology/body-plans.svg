<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Animal body plans</title><desc id="d">Organisation, germ layers, symmetry and coelom</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#138a73"/></marker><style>.title{font:800 30px Arial;fill:#102a4c}.sub{font:500 16px Arial;fill:#536b86}.label{font:700 18px Arial;fill:#17365d}.note{font:500 13px Arial;fill:#506781}.arrow{font:700 13px Arial;fill:#08765d}</style></defs><rect width="1000" height="620" fill="#fbfdff"/><text x="500" y="48" text-anchor="middle" class="title">Animal body plans</text><text x="500" y="76" text-anchor="middle" class="sub">SCRUTINY ACADEMY • BOARD DIAGRAM</text><g><path d="M300 170 L385 170" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="342.5" y="163" text-anchor="middle" class="arrow">complexity</text></g><g><path d="M615 170 L700 170" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="657.5" y="163" text-anchor="middle" class="arrow">body plan</text></g><g><path d="M500 210 L325 360" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M550 210 L605 360" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><path d="M600 210 L865 360" stroke="#138a73" stroke-width="3" fill="none" marker-end="url(#a)"/></g><g><rect x="70" y="130" width="230" height="80" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="185" y="160" text-anchor="middle" class="label">Cellular / tissue level</text><text x="185" y="183" text-anchor="middle" class="note">increasing complexity</text></g><g><rect x="385" y="130" width="230" height="80" rx="18" fill="#eaf2ff" stroke="#17365d" stroke-width="2"/><text x="500" y="160" text-anchor="middle" class="label">Diploblastic / triploblastic</text><text x="500" y="183" text-anchor="middle" class="note">two or three germ layers</text></g><g><rect x="700" y="130" width="230" height="80" rx="18" fill="#fff4df" stroke="#17365d" stroke-width="2"/><text x="815" y="160" text-anchor="middle" class="label">Radial / bilateral</text><text x="815" y="183" text-anchor="middle" class="note">body symmetry</text></g><g><rect x="210" y="360" width="230" height="80" rx="18" fill="#f3ecff" stroke="#17365d" stroke-width="2"/><text x="325" y="390" text-anchor="middle" class="label">Acoelomate</text><text x="325" y="413" text-anchor="middle" class="note">no body cavity</text></g><g><rect x="490" y="360" width="230" height="80" rx="18" fill="#ffecef" stroke="#17365d" stroke-width="2"/><text x="605" y="390" text-anchor="middle" class="label">Pseudocoelomate</text><text x="605" y="413" text-anchor="middle" class="note">cavity not fully lined</text></g><g><rect x="770" y="360" width="190" height="80" rx="18" fill="#e8f7f1" stroke="#17365d" stroke-width="2"/><text x="865" y="390" text-anchor="middle" class="label">Eucoelomate</text><text x="865" y="413" text-anchor="middle" class="note">mesoderm-lined cavity</text></g><text x="500" y="598" text-anchor="middle" class="sub">Redraw neatly and label every indicated structure in the examination.</text></svg>
