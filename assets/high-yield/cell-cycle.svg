<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img"><rect width="680" height="340" rx="18" fill="#f5f8fc"/><g font-family="Arial" fill="#18253f"><title>Cell cycle schematic with four successive phases labelled A through D</title><text x="340" y="36" text-anchor="middle" font-size="22">Cell cycle · direction of progression →</text><g stroke="#1a7c80" stroke-width="4" fill="none"><path d="M80 155H590M575 144l15 11-15 11"/></g><rect x="35" y="95" width="115" height="120" rx="18" fill="#d4efe7"/><text x="92" y="142" text-anchor="middle" font-size="32">A</text><text x="92" y="188" text-anchor="middle" font-size="20">G₁</text><rect x="195" y="95" width="115" height="120" rx="18" fill="#dceafa"/><text x="252" y="142" text-anchor="middle" font-size="32">B</text><text x="252" y="188" text-anchor="middle" font-size="20">S</text><rect x="355" y="95" width="115" height="120" rx="18" fill="#eee0fa"/><text x="412" y="142" text-anchor="middle" font-size="32">C</text><text x="412" y="188" text-anchor="middle" font-size="20">G₂</text><rect x="515" y="95" width="115" height="120" rx="18" fill="#fae5cd"/><text x="572" y="142" text-anchor="middle" font-size="32">D</text><text x="572" y="188" text-anchor="middle" font-size="20">M</text><text x="340" y="275" text-anchor="middle" font-size="19">After D, daughter cells return to A.</text></g></svg>