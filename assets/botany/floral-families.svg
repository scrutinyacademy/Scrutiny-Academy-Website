<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="t d"><title id="t">Diagnostic floral families</title><desc id="d">Use symmetry, stamens, ovary and fruit to identify a family</desc><defs><style>.h{font:700 28px Arial;fill:#103f37}.s{font:15px Arial;fill:#5c716c}.l{font:700 15px Arial;fill:#153c35}.n{font:13px Arial;fill:#294b44}.lne{stroke:#426d63;stroke-width:2;fill:none}.g{fill:#dcf4e9;stroke:#08765d;stroke-width:3}.b{fill:#e8f1ff;stroke:#2864b7;stroke-width:3}.y{fill:#fff1bd;stroke:#c58b00;stroke-width:3}.p{fill:#f6e6f5;stroke:#9b4a91;stroke-width:3}</style></defs><rect width="900" height="540" rx="24" fill="#fbfdfc"/><text x="42" y="52" class="h">Diagnostic floral families</text><text x="42" y="78" class="s">Use symmetry, stamens, ovary and fruit to identify a family</text>
<circle cx="165" cy="225" r="105" class="g"/><circle cx="165" cy="225" r="55" fill="none" stroke="#446b62" stroke-width="2"/><text x="165" y="205" class="l" text-anchor="middle">FABACEAE</text><text x="165" y="232" class="n" text-anchor="middle">Zygomorphic</text><text x="165" y="254" class="n" text-anchor="middle">10 stamens: 9+1</text><text x="165" y="395" class="l" text-anchor="middle">Fruit: Legume</text><circle cx="450" cy="225" r="105" class="b"/><circle cx="450" cy="225" r="55" fill="none" stroke="#446b62" stroke-width="2"/><text x="450" y="205" class="l" text-anchor="middle">SOLANACEAE</text><text x="450" y="232" class="n" text-anchor="middle">Actinomorphic</text><text x="450" y="254" class="n" text-anchor="middle">5 epipetalous</text><text x="450" y="395" class="l" text-anchor="middle">Fruit: Berry / capsule</text><circle cx="735" cy="225" r="105" class="p"/><circle cx="735" cy="225" r="55" fill="none" stroke="#446b62" stroke-width="2"/><text x="735" y="205" class="l" text-anchor="middle">LILIACEAE</text><text x="735" y="232" class="n" text-anchor="middle">Trimerous</text><text x="735" y="254" class="n" text-anchor="middle">6 epiphyllous</text><text x="735" y="395" class="l" text-anchor="middle">Fruit: Capsule / berry</text><text x="42" y="515" class="s">Scrutiny Academy • Board-answer diagram • Practise drawing with a sharp pencil</text></svg>