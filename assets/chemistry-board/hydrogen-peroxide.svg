<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Hydrogen peroxide and water hardness</title><desc id="desc">Open-book H₂O₂ structure and hardness-ion removal</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#7e22ce"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="632" rx="30" fill="#fff" stroke="#ead7f7" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="95" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="url(#ink)">Hydrogen peroxide and water hardness</text><text x="75" y="130" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Open-book H₂O₂ structure and hardness-ion removal</text>
<style>text{font-family:Arial,sans-serif}.h{font-size:24px;font-weight:800;fill:#3b1763}.t{font-size:20px;fill:#334155}.s{font-size:17px;fill:#64748b}.bond{stroke:#3b1763;stroke-width:6;stroke-linecap:round}.thin{stroke:#7e22ce;stroke-width:3;fill:none}.box{fill:#fffaf3;stroke:#d8b4fe;stroke-width:3}.atom{fill:#f3e8ff;stroke:#7e22ce;stroke-width:4}.accent{fill:#ea580c}.purple{fill:#7e22ce}</style><g transform="translate(110 230)"><text x="240" y="0" text-anchor="middle" class="h">H₂O₂ open-book structure</text><circle cx="185" cy="130" r="30" class="atom"/><circle cx="295" cy="130" r="30" class="atom"/><circle cx="85" cy="70" r="20" class="accent"/><circle cx="395" cy="190" r="20" class="accent"/><path d="M110 82L158 112M212 130H268M322 147L375 180" class="bond"/><text x="185" y="139" text-anchor="middle" class="h">O</text><text x="295" y="139" text-anchor="middle" class="h">O</text><text x="85" y="78" text-anchor="middle" class="h">H</text><text x="395" y="198" text-anchor="middle" class="h">H</text><text x="240" y="240" text-anchor="middle" class="t">oxygen oxidation number = −1</text></g><g transform="translate(670 220)"><rect width="390" height="300" rx="24" class="box"/><text x="195" y="45" text-anchor="middle" class="h">Hard water treatment</text><text x="195" y="105" text-anchor="middle" class="t">Ca²⁺ / Mg²⁺ + CO₃²⁻</text><path d="M195 125V175" class="thin" marker-end="url(#arrow)"/><text x="195" y="215" text-anchor="middle" class="t">CaCO₃ / MgCO₃ ↓</text><text x="195" y="265" text-anchor="middle" class="s">or exchange hardness ions for Na⁺</text></g>
