<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">VSEPR molecular shapes</title><desc id="desc">Count electron domains first; lone pairs compress bond angles</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#7e22ce"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="632" rx="30" fill="#fff" stroke="#ead7f7" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="95" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="url(#ink)">VSEPR molecular shapes</text><text x="75" y="130" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Count electron domains first; lone pairs compress bond angles</text>
<style>text{font-family:Arial,sans-serif}.h{font-size:24px;font-weight:800;fill:#3b1763}.t{font-size:20px;fill:#334155}.s{font-size:17px;fill:#64748b}.bond{stroke:#3b1763;stroke-width:6;stroke-linecap:round}.thin{stroke:#7e22ce;stroke-width:3;fill:none}.box{fill:#fffaf3;stroke:#d8b4fe;stroke-width:3}.atom{fill:#f3e8ff;stroke:#7e22ce;stroke-width:4}.accent{fill:#ea580c}.purple{fill:#7e22ce}</style><g transform="translate(120 220)"><text x="110" y="0" text-anchor="middle" class="h">Linear</text><circle cx="110" cy="100" r="23" class="atom"/><circle cx="20" cy="100" r="18" class="accent"/><circle cx="200" cy="100" r="18" class="accent"/><path d="M43 100H87M133 100H177" class="bond"/><text x="110" y="165" text-anchor="middle" class="s">BeCl₂ • 180°</text></g><g transform="translate(430 220)"><text x="110" y="0" text-anchor="middle" class="h">Trigonal planar</text><circle cx="110" cy="100" r="23" class="atom"/><circle cx="20" cy="100" r="18" class="accent"/><circle cx="190" cy="35" r="18" class="accent"/><circle cx="190" cy="165" r="18" class="accent"/><path d="M43 100H87M130 84L172 48M130 116L172 152" class="bond"/><text x="110" y="205" text-anchor="middle" class="s">BF₃ • 120°</text></g><g transform="translate(800 205)"><text x="120" y="0" text-anchor="middle" class="h">Tetrahedral</text><circle cx="120" cy="120" r="23" class="atom"/><circle cx="120" cy="35" r="18" class="accent"/><circle cx="35" cy="160" r="18" class="accent"/><circle cx="205" cy="160" r="18" class="accent"/><circle cx="120" cy="215" r="18" class="accent"/><path d="M120 97V55M100 133L53 154M140 133L187 154M120 143V197" class="bond"/><text x="120" y="265" text-anchor="middle" class="s">CH₄ • 109.5°</text></g><rect x="170" y="520" width="860" height="62" rx="18" class="box"/><text x="600" y="560" text-anchor="middle" class="t">Repulsion order: lone pair–lone pair &gt; lone pair–bond pair &gt; bond pair–bond pair</text>
<text x="600" y="640" text-anchor="middle" class="s">Scrutiny Academy • redraw neatly and label in the board examination</text></svg>