<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Equilibrium, pH and buffer action</title><desc id="desc">Compare Q with K; a buffer consumes small added acid or base</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#7e22ce"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="632" rx="30" fill="#fff" stroke="#ead7f7" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="95" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="url(#ink)">Equilibrium, pH and buffer action</text><text x="75" y="130" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Compare Q with K; a buffer consumes small added acid or base</text>
<style>text{font-family:Arial,sans-serif}.h{font-size:24px;font-weight:800;fill:#3b1763}.t{font-size:20px;fill:#334155}.s{font-size:17px;fill:#64748b}.bond{stroke:#3b1763;stroke-width:6;stroke-linecap:round}.thin{stroke:#7e22ce;stroke-width:3;fill:none}.box{fill:#fffaf3;stroke:#d8b4fe;stroke-width:3}.atom{fill:#f3e8ff;stroke:#7e22ce;stroke-width:4}.accent{fill:#ea580c}.purple{fill:#7e22ce}</style><rect x="100" y="200" width="470" height="320" rx="24" class="box"/><text x="335" y="245" text-anchor="middle" class="h">Reaction direction</text><text x="335" y="310" text-anchor="middle" class="t">Q &lt; K  →  forward</text><text x="335" y="370" text-anchor="middle" class="t">Q = K  →  equilibrium</text><text x="335" y="430" text-anchor="middle" class="t">Q &gt; K  →  reverse</text><rect x="630" y="200" width="470" height="320" rx="24" class="box"/><text x="865" y="245" text-anchor="middle" class="h">Acidic buffer HA / A⁻</text><text x="865" y="310" text-anchor="middle" class="t">Added H⁺: A⁻ + H⁺ → HA</text><text x="865" y="370" text-anchor="middle" class="t">Added OH⁻: HA + OH⁻ → A⁻ + H₂O</text><text x="865" y="430" text-anchor="middle" class="t">pH = pKa + log([A⁻]/[HA])</text>
<text x="600" y="640" text-anchor="middle" class="s">Scrutiny Academy • redraw neatly and label in the board examination</text></svg>