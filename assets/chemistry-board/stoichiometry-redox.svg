<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Stoichiometry and redox workflow</title><desc id="desc">A reliable scoring sequence for numericals and ionic equations</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#7e22ce"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="632" rx="30" fill="#fff" stroke="#ead7f7" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="95" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="url(#ink)">Stoichiometry and redox workflow</text><text x="75" y="130" font-family="Arial,sans-serif" font-size="19" fill="#64748b">A reliable scoring sequence for numericals and ionic equations</text>
<style>text{font-family:Arial,sans-serif}.h{font-size:24px;font-weight:800;fill:#3b1763}.t{font-size:20px;fill:#334155}.s{font-size:17px;fill:#64748b}.bond{stroke:#3b1763;stroke-width:6;stroke-linecap:round}.thin{stroke:#7e22ce;stroke-width:3;fill:none}.box{fill:#fffaf3;stroke:#d8b4fe;stroke-width:3}.atom{fill:#f3e8ff;stroke:#7e22ce;stroke-width:4}.accent{fill:#ea580c}.purple{fill:#7e22ce}</style><g transform="translate(85 220)"><rect x="0" y="0" width="180" height="90" rx="18" class="box"/><text x="90" y="38" text-anchor="middle" class="h">1</text><text x="90" y="68" text-anchor="middle" class="s">Balance equation</text><path d="M182 45H210" class="thin" marker-end="url(#arrow)"/><rect x="215" y="0" width="180" height="90" rx="18" class="box"/><text x="305" y="38" text-anchor="middle" class="h">2</text><text x="305" y="68" text-anchor="middle" class="s">Convert to moles</text><path d="M397 45H425" class="thin" marker-end="url(#arrow)"/><rect x="430" y="0" width="180" height="90" rx="18" class="box"/><text x="520" y="38" text-anchor="middle" class="h">3</text><text x="520" y="68" text-anchor="middle" class="s">Find limiting reagent</text><path d="M612 45H640" class="thin" marker-end="url(#arrow)"/><rect x="645" y="0" width="180" height="90" rx="18" class="box"/><text x="735" y="38" text-anchor="middle" class="h">4</text><text x="735" y="68" text-anchor="middle" class="s">Use mole ratio</text><path d="M827 45H855" class="thin" marker-end="url(#arrow)"/><rect x="860" y="0" width="180" height="90" rx="18" class="box"/><text x="950" y="38" text-anchor="middle" class="h">5</text><text x="950" y="68" text-anchor="middle" class="s">Convert to answer</text></g><rect x="150" y="390" width="900" height="150" rx="22" class="box"/><text x="600" y="432" text-anchor="middle" class="h">Ion–electron check</text><text x="600" y="475" text-anchor="middle" class="t">balance atoms → O with H₂O → H with H⁺ → charge with e⁻</text><text x="600" y="515" text-anchor="middle" class="t">equalise electrons • add half-reactions • verify atoms and net charge</text>
<text x="600" y="640" text-anchor="middle" class="s">Scrutiny Academy • redraw neatly and label in the board examination</text></svg>