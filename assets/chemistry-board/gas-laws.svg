<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Gas laws and real-gas behaviour</title><desc id="desc">Use kelvin temperature and identify the constant condition</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#7e22ce"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="632" rx="30" fill="#fff" stroke="#ead7f7" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="95" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="url(#ink)">Gas laws and real-gas behaviour</text><text x="75" y="130" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Use kelvin temperature and identify the constant condition</text>
<style>text{font-family:Arial,sans-serif}.h{font-size:24px;font-weight:800;fill:#3b1763}.t{font-size:20px;fill:#334155}.s{font-size:17px;fill:#64748b}.bond{stroke:#3b1763;stroke-width:6;stroke-linecap:round}.thin{stroke:#7e22ce;stroke-width:3;fill:none}.box{fill:#fffaf3;stroke:#d8b4fe;stroke-width:3}.atom{fill:#f3e8ff;stroke:#7e22ce;stroke-width:4}.accent{fill:#ea580c}.purple{fill:#7e22ce}</style><g transform="translate(90 190)"><rect width="300" height="320" rx="24" class="box"/><text x="150" y="45" text-anchor="middle" class="h">Boyle plot</text><path d="M55 260V80M55 260H260" class="thin"/><path d="M70 100C115 155 175 205 250 235" class="thin"/><text x="25" y="90" class="s">P</text><text x="250" y="290" class="s">V</text><text x="150" y="310" text-anchor="middle" class="t">PV = constant</text></g><g transform="translate(450 190)"><rect width="300" height="320" rx="24" class="box"/><text x="150" y="45" text-anchor="middle" class="h">Charles plot</text><path d="M55 260V80M55 260H260" class="thin"/><path d="M60 250L250 95" class="thin"/><text x="25" y="90" class="s">V</text><text x="250" y="290" class="s">T/K</text><text x="150" y="310" text-anchor="middle" class="t">V/T = constant</text></g><g transform="translate(810 190)"><rect width="300" height="320" rx="24" class="box"/><text x="150" y="45" text-anchor="middle" class="h">Real gas</text><path d="M55 260V80M55 260H260" class="thin"/><path d="M55 170H260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/><path d="M60 170C105 220 175 215 250 115" class="thin"/><text x="25" y="90" class="s">Z</text><text x="250" y="290" class="s">P</text><text x="150" y="310" text-anchor="middle" class="t">Z = PV/nRT</text></g>
