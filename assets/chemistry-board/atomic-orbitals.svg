<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Atomic orbitals and quantum numbers</title><desc id="desc">Shape and orientation map used with the four quantum numbers</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#7e22ce"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="632" rx="30" fill="#fff" stroke="#ead7f7" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="95" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="url(#ink)">Atomic orbitals and quantum numbers</text><text x="75" y="130" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Shape and orientation map used with the four quantum numbers</text>
<style>text{font-family:Arial,sans-serif}.h{font-size:24px;font-weight:800;fill:#3b1763}.t{font-size:20px;fill:#334155}.s{font-size:17px;fill:#64748b}.bond{stroke:#3b1763;stroke-width:6;stroke-linecap:round}.thin{stroke:#7e22ce;stroke-width:3;fill:none}.box{fill:#fffaf3;stroke:#d8b4fe;stroke-width:3}.atom{fill:#f3e8ff;stroke:#7e22ce;stroke-width:4}.accent{fill:#ea580c}.purple{fill:#7e22ce}</style><g transform="translate(110 210)"><circle cx="120" cy="130" r="78" class="atom"/><circle cx="120" cy="130" r="10" class="purple"/><text x="120" y="245" text-anchor="middle" class="h">s orbital</text><text x="120" y="275" text-anchor="middle" class="s">l = 0 • spherical</text></g><g transform="translate(430 205)"><ellipse cx="80" cy="130" rx="70" ry="38" class="atom"/><ellipse cx="220" cy="130" rx="70" ry="38" class="atom"/><circle cx="150" cy="130" r="9" class="purple"/><text x="150" y="245" text-anchor="middle" class="h">p orbital</text><text x="150" y="275" text-anchor="middle" class="s">l = 1 • dumb-bell</text></g><g transform="translate(790 190)"><path d="M150 135C65 20 20 100 130 165C20 230 75 305 150 190C225 305 280 230 170 165C280 100 235 20 150 135Z" class="atom"/><circle cx="150" cy="165" r="9" class="purple"/><text x="150" y="335" text-anchor="middle" class="h">d orbital</text><text x="150" y="365" text-anchor="middle" class="s">l = 2 • clover-like</text></g><rect x="150" y="510" width="900" height="70" rx="18" class="box"/><text x="600" y="553" text-anchor="middle" class="t">n → shell and energy  •  l → shape  •  mₗ → orientation  •  mₛ → spin</text>
<text x="600" y="640" text-anchor="middle" class="s">Scrutiny Academy • redraw neatly and label in the board examination</text></svg>