<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Work–energy theorem</title><desc id="d">Net work changes kinetic energy</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker><style>.h{font:800 30px Arial;fill:#102a4c}.s{font:600 16px Arial;fill:#536b86}.l{font:700 18px Arial;fill:#17365d}.n{font:500 14px Arial;fill:#405a75}.f{font:800 20px Arial;fill:#0b72d9}.axis{stroke:#17365d;stroke-width:3}.line{stroke:#1565c0;stroke-width:4;fill:none}.dash{stroke:#63a3dd;stroke-width:2;stroke-dasharray:8 7;fill:none}.box{fill:#eef6ff;stroke:#75aee0;stroke-width:2}</style></defs><rect width="1000" height="620" fill="#fbfdff"/><text x="500" y="48" text-anchor="middle" class="h">Work–energy theorem</text><text x="500" y="76" text-anchor="middle" class="s">SCRUTINY ACADEMY • PHYSICS BOARD DIAGRAM</text><rect x="100" y="245" width="180" height="105" rx="18" class="box"/><text x="190" y="290" text-anchor="middle" class="l">Initial state</text><text x="190" y="325" text-anchor="middle" class="f">Kᵢ = ½mu²</text><line x1="300" y1="297" x2="680" y2="297" class="line" marker-end="url(#a)"/><text x="490" y="260" text-anchor="middle" class="l">Wnet = ∫F·dr</text><rect x="710" y="245" width="180" height="105" rx="18" class="box"/><text x="800" y="290" text-anchor="middle" class="l">Final state</text><text x="800" y="325" text-anchor="middle" class="f">Kf = ½mv²</text><text x="500" y="440" text-anchor="middle" class="h">Wnet = Kf − Ki</text><text x="500" y="598" text-anchor="middle" class="s">Draw with a ruler, mark directions and label every physical quantity.</text></svg>
