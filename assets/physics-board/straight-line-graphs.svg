<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Kinematics graphs</title><desc id="d">Position-time and velocity-time interpretation</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker><style>.h{font:800 30px Arial;fill:#102a4c}.s{font:600 16px Arial;fill:#536b86}.l{font:700 18px Arial;fill:#17365d}.n{font:500 14px Arial;fill:#405a75}.f{font:800 20px Arial;fill:#0b72d9}.axis{stroke:#17365d;stroke-width:3}.line{stroke:#1565c0;stroke-width:4;fill:none}.dash{stroke:#63a3dd;stroke-width:2;stroke-dasharray:8 7;fill:none}.box{fill:#eef6ff;stroke:#75aee0;stroke-width:2}</style></defs><rect width="1000" height="620" fill="#fbfdff"/><text x="500" y="48" text-anchor="middle" class="h">Kinematics graphs</text><text x="500" y="76" text-anchor="middle" class="s">SCRUTINY ACADEMY • PHYSICS BOARD DIAGRAM</text><line x1="110" y1="490" x2="450" y2="490" class="axis"/><line x1="110" y1="490" x2="110" y2="150" class="axis"/><path d="M110 450 L410 180" class="line"/><text x="270" y="520" class="l">time t</text><text x="40" y="170" class="l">position x</text><text x="235" y="260" class="f">slope = velocity</text><line x1="560" y1="490" x2="900" y2="490" class="axis"/><line x1="560" y1="490" x2="560" y2="150" class="axis"/><path d="M560 420 L870 190" class="line"/><path d="M560 490 L560 420 L870 190 L870 490 Z" fill="#d9edff" opacity=".8"/><text x="720" y="520" class="l">time t</text><text x="500" y="170" class="l">velocity v</text><text x="690" y="270" class="f">slope = acceleration</text><text x="675" y="455" class="n">area = displacement</text><text x="500" y="598" text-anchor="middle" class="s">Draw with a ruler, mark directions and label every physical quantity.</text></svg>
