<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d"><title id="t">Galvanic zinc-copper electrode process</title><desc id="d">Zinc anode and copper cathode joined by an external wire and salt bridge, with electron flow from zinc to copper.</desc><rect width="720" height="320" rx="24" fill="#f7faff"/><text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#17324d">Zn | Zn²⁺ || Cu²⁺ | Cu</text><path d="M150 82V60H570V82" fill="none" stroke="#e25f35" stroke-width="6"/><path d="M330 60h120" stroke="#e25f35" stroke-width="6" marker-end="url(#a)"/><text x="390" y="52" text-anchor="middle" font-family="Arial" font-size="16" fill="#a93416">electron flow</text><g font-family="Arial"><rect x="65" y="110" width="235" height="145" rx="18" fill="#dff1ff" stroke="#3977a8" stroke-width="3"/><rect x="420" y="110" width="235" height="145" rx="18" fill="#dff7f2" stroke="#14866d" stroke-width="3"/><rect x="132" y="78" width="36" height="135" fill="#9fa9b2"/><rect x="552" y="78" width="36" height="135" fill="#bf6f45"/><path d="M270 135c75-70 105-70 180 0" fill="none" stroke="#8052a8" stroke-width="12"/><text x="182" y="287" text-anchor="middle" font-size="20">Anode: Zn → Zn²⁺ + 2e⁻</text><text x="538" y="287" text-anchor="middle" font-size="20">Cathode: Cu²⁺ + 2e⁻ → Cu</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#e25f35"/></marker></defs></svg>
