<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d"><title id="t">Inductive, resonance and hyperconjugative effects</title><desc id="d">Three labelled electron-displacement patterns.</desc><rect width="720" height="320" rx="24" fill="#fbfaf7"/><text x="360" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2e2b22">Electronic effects</text><g font-family="Arial"><g transform="translate(35 78)"><rect width="205" height="180" rx="16" fill="#fff" stroke="#557ea8"/><text x="102" y="32" text-anchor="middle" font-size="20" font-weight="700">Inductive (I)</text><text x="102" y="78" text-anchor="middle" font-size="24">δ⁺C—C—Xδ⁻</text><path d="M70 105h75" stroke="#d35933" stroke-width="4" marker-end="url(#a)"/><text x="102" y="145" text-anchor="middle" font-size="16">through σ bonds</text></g><g transform="translate(258 78)"><rect width="205" height="180" rx="16" fill="#fff" stroke="#9b6bd3"/><text x="102" y="32" text-anchor="middle" font-size="20" font-weight="700">Resonance (R)</text><text x="102" y="82" text-anchor="middle" font-size="23">O⁻—C=O ↔ O=C—O⁻</text><text x="102" y="145" text-anchor="middle" font-size="16">π/lone-pair delocalisation</text></g><g transform="translate(480 78)"><rect width="205" height="180" rx="16" fill="#fff" stroke="#2f9f83"/><text x="102" y="32" text-anchor="middle" font-size="20" font-weight="700">Hyperconjugation</text><text x="102" y="82" text-anchor="middle" font-size="23">C—H → C⁺</text><text x="102" y="145" text-anchor="middle" font-size="16">adjacent σ-electron donation</text></g></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#d35933"/></marker></defs></svg>
