<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d"><title id="t">Addition of HBr to propene</title><desc id="d">Markovnikov and peroxide pathways for addition of hydrogen bromide to propene.</desc><rect width="720" height="320" rx="24" fill="#f8fbff"/><text x="360" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">HBr addition to propene</text><g font-family="Arial" text-anchor="middle"><text x="115" y="165" font-size="25">CH₃—CH=CH₂</text><path d="M220 130h180" stroke="#2d668f" stroke-width="4" marker-end="url(#a)"/><path d="M220 205h180" stroke="#b45d32" stroke-width="4" marker-end="url(#b)"/><text x="310" y="115" font-size="18">HBr (no peroxide)</text><text x="310" y="235" font-size="18">HBr, ROOR</text><text x="545" y="120" font-size="23">CH₃—CHBr—CH₃</text><text x="545" y="150" font-size="17" fill="#2d668f">Markovnikov product</text><text x="545" y="210" font-size="23">CH₃—CH₂—CH₂Br</text><text x="545" y="240" font-size="17" fill="#b45d32">anti-Markovnikov product</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#2d668f"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#b45d32"/></marker></defs></svg>
