<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t d"><title id="t">Reactive intermediate stability</title><desc id="d">Carbocation, free-radical and carbanion centres with typical alkyl substitution stability trends.</desc><rect width="720" height="310" rx="24" fill="#f8fbff"/><text x="360" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Reactive intermediates</text><g font-family="Arial" text-anchor="middle"><g transform="translate(120 80)"><rect width="150" height="165" rx="16" fill="#fff" stroke="#e85b48" stroke-width="3"/><text x="75" y="42" font-size="22" fill="#b62d20">Carbocation C⁺</text><text x="75" y="80" font-size="18">electron deficient</text><text x="75" y="116" font-size="18">3° &gt; 2° &gt; 1°</text><text x="75" y="144" font-size="15">alkyl groups stabilise</text></g><g transform="translate(285 80)"><rect width="150" height="165" rx="16" fill="#fff" stroke="#9b6bd3" stroke-width="3"/><text x="75" y="42" font-size="22" fill="#6a3ca0">Radical C•</text><text x="75" y="80" font-size="18">one unpaired e⁻</text><text x="75" y="116" font-size="18">3° &gt; 2° &gt; 1°</text><text x="75" y="144" font-size="15">hyperconjugation</text></g><g transform="translate(450 80)"><rect width="150" height="165" rx="16" fill="#fff" stroke="#2f9f83" stroke-width="3"/><text x="75" y="42" font-size="22" fill="#17745f">Carbanion C⁻</text><text x="75" y="80" font-size="18">lone pair on C</text><text x="75" y="116" font-size="18">1° &gt; 2° &gt; 3°*</text><text x="75" y="144" font-size="15">simple alkyl case</text></g></g></svg>
