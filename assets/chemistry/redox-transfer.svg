<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Electron transfer between zinc and copper ions</title><desc id="d">A labelled electron-transfer scheme showing zinc oxidation and copper ion reduction.</desc><rect width="720" height="300" rx="24" fill="#f8fbff"/><text x="360" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Electron transfer in a redox reaction</text><g font-family="Arial" font-size="24" fill="#17324d"><circle cx="115" cy="145" r="54" fill="#e7eef5" stroke="#52677b" stroke-width="4"/><text x="115" y="153" text-anchor="middle">Zn</text><circle cx="605" cy="145" r="54" fill="#dff7f2" stroke="#14866d" stroke-width="4"/><text x="605" y="153" text-anchor="middle">Cu</text><text x="230" y="112">Zn → Zn²⁺ + 2e⁻</text><text x="230" y="190">Cu²⁺ + 2e⁻ → Cu</text><path d="M180 145H535" stroke="#e56b3f" stroke-width="6" marker-end="url(#a)"/><text x="360" y="137" text-anchor="middle" fill="#b13c18">2e⁻</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#e56b3f"/></marker></defs></svg>
