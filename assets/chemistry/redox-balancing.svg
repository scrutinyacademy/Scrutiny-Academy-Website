<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Ion-electron balancing workflow</title><desc id="d">A four-step flow for balancing a redox equation in acidic medium.</desc><rect width="720" height="300" rx="24" fill="#f7fbf7"/><text x="360" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#183b2b">Ion-electron method: acidic medium</text><g font-family="Arial" font-size="17" text-anchor="middle"><g fill="#fff" stroke="#3d8a63" stroke-width="3"><rect x="30" y="90" width="145" height="105" rx="14"/><rect x="200" y="90" width="145" height="105" rx="14"/><rect x="375" y="90" width="145" height="105" rx="14"/><rect x="545" y="90" width="145" height="105" rx="14"/></g><text x="102" y="125">1. Split into</text><text x="102" y="150">half-reactions</text><text x="272" y="120">2. Balance atoms</text><text x="272" y="146">O with H₂O</text><text x="272" y="172">H with H⁺</text><text x="447" y="125">3. Balance charge</text><text x="447" y="153">with e⁻</text><text x="617" y="120">4. Equalise e⁻,</text><text x="617" y="146">add and cancel</text><path d="M176 142h22M346 142h27M521 142h22" stroke="#d56b36" stroke-width="5"/></g><text x="360" y="248" text-anchor="middle" font-family="Arial" font-size="20" fill="#183b2b">Final check: atoms and net charge must both balance</text></svg>
