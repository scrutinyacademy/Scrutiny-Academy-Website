<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t d"><title id="t">Representations of butan-2-ol</title><desc id="d">Condensed, bond-line and wedge-dash representations of the same carbon skeleton.</desc><rect width="720" height="310" rx="24" fill="#fffdf7"/><text x="360" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#3c2d18">Three structural representations</text><g font-family="Arial" fill="#3c2d18"><text x="45" y="92" font-size="18" font-weight="700">Condensed</text><text x="45" y="140" font-size="25">CH₃CH(OH)CH₂CH₃</text><text x="295" y="92" font-size="18" font-weight="700">Bond-line</text><path d="M300 165l70-55l70 55l70-55" fill="none" stroke="#333" stroke-width="6"/><text x="350" y="86" font-size="22" fill="#b34028">OH</text><text x="545" y="92" font-size="18" font-weight="700">Wedge-dash</text><circle cx="620" cy="160" r="10" fill="#333"/><path d="M620 160l-58 50M620 160l60 48M620 160l-48-52" stroke="#333" stroke-width="5"/><path d="M620 160l34-67l-10 73z" fill="#b34028"/><text x="654" y="82" font-size="21">OH</text></g><text x="360" y="275" text-anchor="middle" font-family="Arial" font-size="18" fill="#5c4a30">Connectivity is preserved; wedge and dash add spatial information.</text></svg>
