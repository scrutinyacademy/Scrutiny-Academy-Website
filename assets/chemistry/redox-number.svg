<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Oxidation-number map</title><desc id="d">Worked oxidation-number assignments for peroxide, dichromate and ammonium nitrate.</desc><rect width="720" height="300" rx="24" fill="#fffaf4"/><text x="360" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#412b1d">Oxidation-number map</text><g font-family="Arial" text-anchor="middle"><g transform="translate(35 70)"><rect width="200" height="175" rx="16" fill="#fff" stroke="#e0b786"/><text x="100" y="44" font-size="28">H₂O₂</text><text x="100" y="91" font-size="22">H = +1</text><text x="100" y="129" font-size="22" fill="#bd3d20">O = −1</text><text x="100" y="158" font-size="15">peroxide exception</text></g><g transform="translate(260 70)"><rect width="200" height="175" rx="16" fill="#fff" stroke="#e0b786"/><text x="100" y="44" font-size="28">Cr₂O₇²⁻</text><text x="100" y="91" font-size="22">O = −2</text><text x="100" y="129" font-size="22" fill="#bd3d20">Cr = +6</text><text x="100" y="158" font-size="15">sum = −2</text></g><g transform="translate(485 70)"><rect width="200" height="175" rx="16" fill="#fff" stroke="#e0b786"/><text x="100" y="44" font-size="28">NH₄NO₃</text><text x="100" y="91" font-size="21">N in NH₄⁺ = −3</text><text x="100" y="129" font-size="21" fill="#bd3d20">N in NO₃⁻ = +5</text><text x="100" y="158" font-size="15">same element, two states</text></g></g></svg>
