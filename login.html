<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Opening Scrutiny Academy…</title>
  <link rel="canonical" href="index.html" />
  <meta http-equiv="refresh" content="0;url=index.html?mode=login#authCard" />
</head>
<body>
  <p>Opening the Scrutiny Academy student login… <a href="index.html?mode=login#authCard">Continue</a></p>
  <script>
    const target = new URL('index.html', location.href);
    const current = new URLSearchParams(location.search);
    current.forEach((value, key) => target.searchParams.set(key, value));
    target.searchParams.set('mode', 'login');
    target.hash = 'authCard';
    location.replace(target.href);
  </script>
</body>
</html>
